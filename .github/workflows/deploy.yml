name: Deploy Widget

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_BUNGEE_API_BASE_URL: ${{ vars.VITE_BUNGEE_API_BASE_URL }}
      VITE_BUNGEE_API_KEY: ${{ secrets.VITE_BUNGEE_API_KEY || vars.VITE_BUNGEE_API_KEY }}
      VITE_BUNGEE_AFFILIATE: ${{ vars.VITE_BUNGEE_AFFILIATE }}
      VITE_BUNGEE_FEE_BPS: ${{ vars.VITE_BUNGEE_FEE_BPS }}
      VITE_BUNGEE_FEE_TAKER_ADDRESS: ${{ vars.VITE_BUNGEE_FEE_TAKER_ADDRESS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build widget
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
